spring.application.name=fleetflow
server.port=8080

# =============================================
# MySQL Configuration
# =============================================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/fleetflow_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Password}

# Connection pool — prevents "too many connections" on free tier
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# =============================================
# JPA / Hibernate
# =============================================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# =============================================
# Security / JWT
# =============================================
JWT_SECRET=${JWT_SECRET:carcaddy-super-secret-key-for-jwt-2024-minimum-256-bits}

# =============================================
# CORS
# =============================================
ALLOWED_ORIGINS=${ALLOWED_ORIGINS:http://localhost:4200,http://localhost}

# =============================================
# Mail Configuration
# spring.mail.test-connection=false prevents startup crash when SMTP creds are not set
# =============================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:noreply@fleetflow.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:disabled}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.test-connection=false
