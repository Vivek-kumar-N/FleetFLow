spring.application.name=fleetflow
server.port=8080

# =============================================
# MySQL Configuration
# Environment variables override local fallbacks when running in Docker / cloud.
# =============================================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/fleetflow_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}

spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Password}

# =============================================
# Security / JWT
# =============================================
# Override JWT_SECRET in production with a strong random string (32+ chars).
JWT_SECRET=${JWT_SECRET:carcaddy-super-secret-key-for-jwt-2024-minimum-256-bits}

# =============================================
# CORS
# =============================================
# Comma-separated list of allowed origins. Override in production.
# Example: ALLOWED_ORIGINS=https://fleetflow.vercel.app,https://fleetflow-frontend.onrender.com
ALLOWED_ORIGINS=${ALLOWED_ORIGINS:http://localhost:4200,http://localhost}

# =============================================
# JPA / Hibernate
# =============================================
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# =============================================
# Mail Configuration
# =============================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=YOUR_GMAIL_ADDRESS
spring.mail.password=YOUR_GMAIL_APP_PASSWORD
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

