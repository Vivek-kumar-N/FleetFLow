server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Angular HTML5 routing ──────────────────────────────────────────────
    # For any route that doesn't match a real file or directory, fall back to
    # index.html so Angular's router can handle it client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── API reverse proxy ──────────────────────────────────────────────────
    # Forwards /api/* to the Spring Boot backend container.
    # The service name "backend" resolves via Docker Compose's internal DNS.
    location /api/ {
        proxy_pass         http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Prevent buffering issues with streaming / SSE responses
        proxy_buffering    off;
    }

    # ── Static asset caching ───────────────────────────────────────────────
    # Angular production builds append content hashes to filenames, so these
    # assets can be cached aggressively.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Gzip compression ───────────────────────────────────────────────────
    gzip            on;
    gzip_types      text/plain text/css application/json application/javascript
                    text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;
}
