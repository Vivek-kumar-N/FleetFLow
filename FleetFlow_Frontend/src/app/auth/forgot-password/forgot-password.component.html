<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <div class="logo-icon">FF</div>
      <h2>Reset Password</h2>
      <p>Answer your security question to reset</p>
    </div>

    <div *ngIf="error" class="cc-alert cc-alert-error">{{ error }}</div>
    <div *ngIf="success" class="cc-alert cc-alert-success">{{ success }}</div>

    <!-- Step 1: Enter Username -->
    <form *ngIf="step === 1" [formGroup]="usernameForm" (ngSubmit)="getQuestion()">
      <div class="mb-4">
        <label class="cc-label">Username</label>
        <input type="text" class="cc-input w-100" formControlName="username" placeholder="Enter your username" />
        <div *ngIf="usernameForm.get('username')?.touched && usernameForm.get('username')?.errors?.['required']" class="field-error">Username is required</div>
      </div>
      <button type="submit" class="btn-cc-primary w-100" [disabled]="loading">
        {{ loading ? 'Loading...' : 'Continue' }}
      </button>
    </form>

    <!-- Step 2: Answer Security Question -->
    <form *ngIf="step === 2" [formGroup]="answerForm" (ngSubmit)="verifyAnswer()">
      <div class="mb-3">
        <label class="cc-label">Security Question</label>
        <div class="security-question">{{ securityQuestion }}</div>
      </div>
      <div class="mb-4">
        <label class="cc-label">Your Answer</label>
        <input type="text" class="cc-input w-100" formControlName="securityAnswer" placeholder="Enter your answer" />
        <div *ngIf="answerForm.get('securityAnswer')?.touched && answerForm.get('securityAnswer')?.errors?.['required']" class="field-error">Answer is required</div>
      </div>
      <button type="submit" class="btn-cc-primary w-100" [disabled]="loading">
        {{ loading ? 'Verifying...' : 'Verify' }}
      </button>
    </form>

    <!-- Step 3: New Password -->
    <form *ngIf="step === 3" [formGroup]="passwordForm" (ngSubmit)="resetPassword()">
      <div class="mb-4">
        <label class="cc-label">New Password</label>
        <input type="password" class="cc-input w-100" formControlName="newPassword" placeholder="Min 6 characters" />
        <div *ngIf="passwordForm.get('newPassword')?.touched && passwordForm.get('newPassword')?.errors?.['required']" class="field-error">New password is required</div>
        <div *ngIf="passwordForm.get('newPassword')?.touched && passwordForm.get('newPassword')?.errors?.['minlength']" class="field-error">Password must be at least 6 characters</div>
      </div>
      <button type="submit" class="btn-cc-primary w-100" [disabled]="loading">
        {{ loading ? 'Resetting...' : 'Reset Password' }}
      </button>
    </form>

    <div class="text-center mt-3">
      <a routerLink="/login" class="link-muted">Back to login</a>
    </div>
  </div>
</div>
